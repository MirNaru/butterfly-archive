<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butterfly Archive · 조회</title><link rel="stylesheet" href="/viewer/style.css"><script type="module" src="/viewer/app.js"></script></head><body><main><header><span>BUTTERFLY ARCHIVE</span><h1>나비 아카이브 조회</h1><p>PC에서 갱신한 사본 · 읽기 전용</p></header><p id="message" role="status"></p><section id="login" hidden><h2>내 자료 조회</h2><form id="login-form"><label>PC에서 발급한 조회 코드<input id="code" required maxlength="12" minlength="12" autocomplete="one-time-code" pattern="[a-fA-F0-9]{12}"></label><button>연결하기</button></form></section><section id="viewer" hidden><div class="actions"><p id="updated"></p><button id="refresh">사본 다시 읽기</button><button id="logout">로그아웃</button></div><nav aria-label="조회 종류"><button data-tab="records" aria-pressed="true">관찰 기록</button><button data-tab="catalog" aria-pressed="false">나비 도감</button><button data-tab="holdings" aria-pressed="false">소장 목록</button></nav><div class="filters"><label class="search">검색<input id="query" type="search" placeholder="종명·학명·지역·태그·내용"></label><label>과<select id="family"><option value="">전체</option></select></label><label id="stage-label">성장 단계<select id="stage"><option value="">전체</option><option value="unknown">미상</option><option value="egg">알</option><option value="larva">애벌레</option><option value="pupa">번데기</option><option value="adult">어른벌레</option></select></label><label id="source-label">관찰 출처<select id="source"><option value="">전체</option><option value="direct">직접 관찰</option><option value="indirect">간접 관찰</option></select></label><label id="start-label">날짜 시작<input id="start" type="date"></label><label id="end-label">날짜 종료<input id="end" type="date"></label><button id="reset">조건 초기화</button></div><p id="count" role="status"></p><div id="list"></div><div class="actions"><button id="previous">이전</button><span id="page"></span><button id="next">다음</button></div></section></main></body></html>
