<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>자료 가져오기</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>네이처링 자료 가져오기</h1><p>현재 열린 관찰 기록 한 건을 확인합니다.</p><button id="read">현재 기록 읽기</button><p id="status" role="status"></p><dl id="preview"></dl><button id="save" disabled>확장 프로그램에 보관</button><button id="send" disabled>현재 기록 DB 전송</button><button id="send-all">보관 자료 DB 전송</button><section><button id="auto-start">자동전송 · 끝까지</button><button id="auto-stop" disabled>중지</button><p id="auto-status" role="status"></p></section><details><summary>앱 연결 설정</summary><label>연결 키<input id="connection-key" type="password" autocomplete="off"></label><button id="connect">연결 키 저장</button></details><button id="export">보관 자료 내보내기</button>
<section>
  <button id="clear-archive" type="button" disabled>보관 자료 비우기</button>
  <p id="clear-archive-status" role="status" hidden></p>
  <dialog id="clear-archive-dialog" aria-labelledby="clear-archive-title">
    <h2 id="clear-archive-title">보관 자료 비우기</h2>
    <p id="clear-archive-count"></p>
    <p>확장에만 보관한 자료는 삭제 후 복구할 수 없습니다. 연결 키와 앱 DB에 전송한 자료는 보존됩니다.</p>
    <button id="clear-archive-cancel" type="button" autofocus>취소</button>
    <button id="clear-archive-confirm" type="button">삭제 확인</button>
  </dialog>
</section>
<p class="hint">사진은 저장하지 않습니다. 보관 자료는 이 크롬 프로필에 저장됩니다. DB 전송 후 앱의 자료 수집 화면에서 목록을 새로고침하세요. 자동전송은 다음 관찰이 없어질 때까지 실행합니다. 팝업을 닫아도 진행되며 다시 열어 중지할 수 있습니다.</p><script type="module" src="popup.js"></script></body></html>
